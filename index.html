<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b78"><title>Centum Coaching Centre</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf1fb;font-family:system-ui,-apple-system,Arial,sans-serif;color:#1e293b}button,input{font:inherit}button{cursor:pointer}.app{max-width:900px;min-height:100vh;margin:auto;background:#f4f8ff;padding-bottom:140px}.head{padding:24px 20px 12px;text-align:center}.logo{font-size:30px;font-weight:900;color:#174a8b;line-height:1.05}.logo small{display:block;color:#18243a;font-size:14px;letter-spacing:.5px}.page{padding:18px 18px 35px}.hero{border-radius:24px;overflow:hidden;background:linear-gradient(120deg,#102f5f,#1765b5,#3b82d0);color:#fff;padding:30px 25px;margin:12px 0 26px}.hero h1{font-size:clamp(30px,6vw,46px);line-height:1.18;margin:8px 0}.hero p{line-height:1.65}.section{margin:26px 0}.section h2{font-size:25px;margin:0 0 15px}.section p{color:#5f6c7f;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.course{border:1px solid #e5e7eb;border-radius:22px;overflow:hidden;box-shadow:0 7px 20px #1e293b0d;background:#f4f8ff}.course img{display:block;width:100%;height:160px;object-fit:cover;background:#eef2f7}.course .info{padding:14px}.course strong{font-size:19px}.course small{display:block;color:#64748b;line-height:1.4;margin-top:5px}.floats{position:fixed;bottom:22px;z-index:5;display:flex;flex-direction:column;gap:9px}.floats.left{left:max(12px,calc((100vw - 880px)/2))}.floats.right{right:max(12px,calc((100vw - 880px)/2))}.portal{border:2px solid white;border-radius:18px;color:#fff;padding:13px 14px;min-width:170px;font-weight:800;text-align:left;box-shadow:0 7px 20px #1113;display:flex;align-items:center;gap:9px}.student{background:linear-gradient(120deg,#2878c8,#123b78)}.admin{background:linear-gradient(120deg,#2878c8,#123b78)}.circle{border:1px solid #e5e7eb;border-radius:50%;background:#f1f6ff;width:54px;height:54px;display:grid;place-items:center;box-shadow:0 6px 17px #1112}.circle svg{width:27px;height:27px}.back{background:#eaf2ff;border:1px solid #c7d8f2;border-radius:12px;padding:10px 15px;color:#174a8b;font-weight:750}.login-card{max-width:430px;margin:24px auto;border:1px solid #e5e7eb;border-radius:22px;padding:24px;box-shadow:0 9px 30px #1111}.login-card h2{text-align:center}.field{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:12px;margin:8px 0}.primary{border:0;background:#174a8b;color:white;border-radius:12px;padding:15px 20px;width:100%;font-weight:800;margin-top:10px}.muted{font-size:13px;color:#64748b;line-height:1.5}.splash{min-height:90vh;display:grid;place-content:center;text-align:center;padding:30px}.splash h1{font-size:48px;color:#174a8b;margin:0}.splash p{font-weight:600}.dashboard{background:#eaf2ff;border:1px solid #cbdcf5;border-radius:18px;padding:22px;margin-top:20px}@media(max-width:380px){.portal{min-width:146px;font-size:13px;padding:12px 9px}.course img{height:120px}.grid{gap:10px}.course .info{padding:10px}}@media(min-width:700px){.course img{height:210px}}
</style></head><body><div class="app" id="app"></div><script>
const app=document.getElementById("app");let role="student";let page="home";
const icons={
wa:'<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#25D366" d="M16 2.5A13.5 13.5 0 0 0 4.4 22.9L2.8 29.2l6.5-1.7A13.5 13.5 0 1 0 16 2.5Zm0 24.5c-2 0-3.9-.5-5.5-1.5l-.4-.2-3.8 1 1-3.7-.3-.4A11 11 0 1 1 16 27Zm6.1-8.2c-.3-.2-1.9-1-2.2-1.1-.3-.1-.5-.1-.7.2-.2.4-.9 1.1-1.1 1.3-.2.2-.4.2-.8 0a9.5 9.5 0 0 1-2.7-1.7 10 10 0 0 1-1.9-2.3c-.2-.3 0-.5.2-.7l.5-.6.3-.5c.1-.2 0-.4 0-.6l-1.1-2.6c-.3-.6-.5-.5-.7-.5h-.7c-.2 0-.6.1-1 .5s-1.3 1.3-1.3 3.1 1.3 3.5 1.5 3.7 2.6 4.1 6.4 5.5c.9.3 1.6.5 2.2.7.9.3 1.7.2 2.3.1.7-.1 2-.8 2.3-1.6.3-.8.3-1.4.2-1.6-.1-.1-.3-.2-.7-.4Z"/></svg>',
map:'<svg viewBox="0 0 24 24" fill="none" stroke="#174a8b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
phone:'<svg viewBox="0 0 24 24" fill="none" stroke="#174a8b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.5 3a2 2 0 0 1-.6 1.7L7.2 10a16 16 0 0 0 6 6l1.6-1.8a2 2 0 0 1 1.7-.6l3 .5a2 2 0 0 1 1.5 2.8Z"/></svg>'
};
const courses=[
{name:"Tuition",icon:"📚",desc:"School subject coaching and guidance",img:"https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=900&q=85"},
{name:"TET",icon:"📝",desc:"Teacher Eligibility Test preparation",img:"https://images.unsplash.com/photo-1427504494785-3a9ca7044f45?auto=format&fit=crop&w=900&q=85"},
{name:"TRB",icon:"🎓",desc:"Teacher Recruitment Board exam coaching",img:"https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=900&q=85"},
{name:"NEET",icon:"🩺",desc:"Medical entrance examination preparation",img:"https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=900&q=85"}
];
function logo(){return '<header class="head"><div class="logo">🎓 CENTUM<small>COACHING CENTRE</small></div></header>'}
function buttons(){return '<div class="floats left"><button class="portal student" data-role="student">🎓 Student Portal</button><button class="portal admin" data-role="admin">🛡️ Admin Portal</button></div><div class="floats right"><button class="circle" data-contact="WhatsApp" aria-label="WhatsApp" title="WhatsApp">'+icons.wa+'</button><button class="circle" data-contact="Location" aria-label="Location" title="Location">'+icons.map+'</button><button class="circle" data-contact="Contact" aria-label="Contact" title="Contact">'+icons.phone+'</button></div>'}
function show(next){page=next;history.pushState({page:next,role:role},"","#"+next);render()}
function render(){if(page==="login"){app.innerHTML='<main class="page"><button class="back" data-back="1">← Back</button>'+logo()+'<section class="login-card"><h2>'+role.toUpperCase()+' LOGIN</h2><form id="loginForm"><input class="field" name="user" autocomplete="off" required placeholder="'+(role==="student"?"Student ID / Mobile Number":"Admin ID / Email")+'"><input class="field" name="pass" type="password" autocomplete="off" minlength="3" required placeholder="Password"><button class="primary" type="submit">Enter Demo Portal</button></form><p class="muted">Demo access: enter any ID and a password of at least 3 characters. This is not real authentication.</p></section></main>';return}
if(page==="dashboard"){app.innerHTML='<main class="page"><button class="back" data-back="1">← Back</button>'+logo()+'<section class="dashboard"><h2>'+role.toUpperCase()+' Demo Portal</h2><p>Demo navigation is working. Real accounts, records and permissions require a secure backend before launch.</p><button class="primary" data-home="1">Return to Website</button></section></main>';return}
if(page==="splash"){app.innerHTML='<div class="splash"><div style="font-size:50px">🎓</div><h1>CENTUM</h1><h2>COACHING CENTRE</h2><p>Tuition · TET · TRB · NEET</p><button class="primary" data-home="1">Explore Our Centre →</button></div>';return}
app.innerHTML=logo()+'<main class="page"><section class="hero"><div style="font-size:30px">📚</div><h1>Learn Today.<br>Lead Tomorrow.</h1><p>Focused coaching for Tuition, TET, TRB and NEET.</p></section><section class="section"><h2>About Centum</h2><p>Build strong fundamentals, develop exam confidence and track academic progress with guided learning.</p></section><section class="section"><h2>Academic Programmes</h2><div class="grid">'+courses.map(c=>'<article class="course"><img loading="lazy" src="'+c.img+'" alt="'+c.name+' coaching students" onerror="this.style.display=\'none\'"><div class="info"><strong>'+c.icon+' '+c.name+'</strong><small>'+c.desc+'</small></div></article>').join("")+'</div></section><section class="section"><h2>Learning Experience</h2><p>Concept-based lessons · Practice tests · Study materials · Progress reviews · Doubt support · Academic guidance</p></section></main>'+buttons()}
document.addEventListener("click",function(e){const r=e.target.closest("[data-role]");if(r){role=r.dataset.role;show("login");return}if(e.target.closest("[data-home]")){show("home");return}if(e.target.closest("[data-back]")){show("home");return}const c=e.target.closest("[data-contact]");if(c){alert(c.dataset.contact+" details will be enabled after the coaching centre provides its official contact information.")}});
document.addEventListener("submit",function(e){if(e.target.id!=="loginForm")return;e.preventDefault();const d=new FormData(e.target);if(String(d.get("user")).trim()&&String(d.get("pass")).length>=3)show("dashboard")});
window.addEventListener("popstate",function(e){page=e.state?.page||"home";role=e.state?.role||role;render()});
history.replaceState({page:"home",role:"student"},"","#home");render();
</script></body></html>
