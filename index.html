<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c81024"><title>CENTUM | Coaching Centre</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--red:#d70d23;--navy:#182342;--muted:#737b8b;--line:#e9eaf0}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f7f5f7;color:#1b2030}button,input{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:auto;min-height:100dvh;background:#fff;box-shadow:0 0 50px #30132712;position:relative;overflow:hidden}.top{height:69px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#fff}.brand{display:flex;align-items:center;gap:8px;justify-content:center}.mark{color:var(--red);font-size:33px;line-height:1}.brandtext{line-height:1}.brandtext b{display:block;color:#a70919;font-size:22px;letter-spacing:-1px}.brandtext small{font-size:10px;font-weight:900;letter-spacing:.1px}.icbtn{background:none;border:0;font-size:23px;color:var(--red)}.page{padding:18px 19px 96px;min-height:calc(100dvh - 69px)}.splash{min-height:100dvh;background:linear-gradient(145deg,#ab001c 0%,#f21a20 58%,#ff9b00 85%,#fff4e9 100%);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:35px 25px}.splash .mark{font-size:94px;color:white}.splash h1{font-size:47px;margin:10px 0 0;letter-spacing:-2px}.splash h2{margin:0;font-size:19px}.splash p{line-height:1.7;font-size:14px}.primary{border:0;background:linear-gradient(110deg,#fa2431,#bd001b);color:white;border-radius:12px;padding:15px 22px;font-weight:800;width:100%;box-shadow:0 8px 20px #dc0a2924}.splash .primary{background:white;color:#bd001b;margin-top:50px}.heading{text-align:center;margin:18px 0 25px;font-size:25px}.roles{display:grid;gap:14px}.role{display:flex;align-items:center;text-align:left;gap:16px;padding:20px 17px;border:0;color:white;border-radius:15px;box-shadow:0 7px 14px #00000012}.role .emoji{font-size:30px}.role strong{display:block;font-size:17px}.role small{display:block;font-size:11px;margin-top:5px}.role .arrow{margin-left:auto;font-size:24px}.student{background:linear-gradient(110deg,#ff2834,#b90020)}.teacher{background:linear-gradient(110deg,#2871e9,#06246d)}.admin{background:linear-gradient(110deg,#ff9b16,#f15b00)}.outline{width:100%;border:1px solid #d9dce6;border-radius:12px;padding:13px;background:#fff;font-weight:700;color:#27334a}.apply{margin-top:30px;background:#f6f8fc}.loginicon{text-align:center;font-size:44px;margin:20px 0 8px}.loginheading{text-align:center;font-size:24px;margin:0 0 27px}.field{width:100%;border:1px solid #d5d9e2;padding:15px;border-radius:11px;margin-bottom:13px;outline-color:#d70d23;background:white}.forgot{color:#d70d23;text-align:right;font-size:12px;font-weight:700;margin:0 0 20px}.divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:#666;font-size:12px}.divider:before,.divider:after{content:"";height:1px;background:#ddd;flex:1}.tiny{text-align:center;font-size:12px;margin:18px 0}.tiny b{color:var(--red);cursor:pointer}.hero{margin:-18px -19px 18px;padding:25px 19px;background:linear-gradient(115deg,#bb001b,#f02b16 52%,#ffb019);color:white;display:flex;justify-content:space-between;align-items:center}.hero h2{font-size:21px;margin:0 0 6px}.hero p{font-size:12px;margin:0}.avatar{width:55px;height:55px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;background:#fff6e9;font-size:30px}.promo{background:linear-gradient(115deg,#d40b22,#ff5c05 65%,#ffb600);border-radius:15px;padding:18px;color:white;margin-bottom:16px}.promo h3{font-size:20px;margin:0 0 7px}.promo p{font-size:12px;margin:0}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tile{border:1px solid #eef0f4;background:white;border-radius:13px;box-shadow:0 3px 10px #1111110c;min-height:100px;padding:13px 5px;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}.tile .symbol{font-size:29px}.tile strong{font-size:11px;line-height:1.25}.sectiontitle{font-size:18px;margin:24px 0 14px}.coursegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.course{color:white;border:0;border-radius:12px;min-height:90px;font-weight:900;font-size:15px}.course span{display:block;font-size:25px;margin-bottom:6px}.course:nth-child(1){background:#d80d28}.course:nth-child(2){background:#1260d5}.course:nth-child(3){background:#349a14}.course:nth-child(4){background:#7824bf}.course:nth-child(5){background:#029ca3}.course:nth-child(6){background:#fa650b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{padding:12px 3px;text-align:center;color:white;border-radius:12px;background:#1672e9}.stat:nth-child(2){background:#8326cb}.stat:nth-child(3){background:#0aab55}.stat:nth-child(4){background:#f77700}.stat b{font-size:19px;display:block}.stat small{font-size:9px}.panel{background:white;border:1px solid #e8eaf0;border-radius:14px;padding:15px;margin-top:12px;box-shadow:0 4px 12px #00000008}.panel p{font-size:12px;color:#626c7b;line-height:1.6}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:white;border-top:1px solid #e9e9ef;display:flex;justify-content:space-around;padding:10px 0 max(10px,env(safe-area-inset-bottom))}.navitem{background:none;border:0;font-size:10px;color:#6a7281;display:grid;gap:4px;text-align:center}.navitem span{font-size:21px}.navitem.active{color:var(--red);font-weight:800}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#202a3b;color:white;padding:12px 18px;border-radius:12px;font-size:12px;width:max-content;max-width:90%;z-index:10}.back{border:0;background:none;color:var(--red);font-size:24px}.row{display:flex;align-items:center;justify-content:space-between}.listrow{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:13px 0;font-size:13px}.tag{color:#0a9a50;background:#e8f9ee;border-radius:8px;padding:5px 8px;font-size:10px;font-weight:700}@media(min-width:700px){body{padding:24px}.app{border-radius:28px;min-height:850px}.bottom{bottom:24px;border-radius:0 0 28px 28px}}</style></head><body><div class="app" id="app"></div><script>
const app=document.getElementById('app');let role='',page='splash',section='Home';const courses=['NEET','JEE','TNPSC','UPSC','CUET','Foundation'];const icons=['🩺','⚙️','🏛️','⚖️','🎓','📚'];function brand(){return '<div class="brand"><div class="mark">🎓</div><div class="brandtext"><b>CENTUM</b><small>COACHING CENTRE</small></div></div>'}function header(){return '<header class="top"><button class="icbtn" onclick="menu()">☰</button>'+brand()+'<button class="icbtn" onclick="toast(\'No new notifications\')">♧</button></header>'}function toast(msg){let e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.append(e);setTimeout(()=>e.remove(),2300)}function go(p,r){page=p;if(r)role=r;render();window.scrollTo(0,0)}function menu(){if(confirm('Switch user or return to login?'))go('roles')}function bottom(){return '<nav class="bottom">'+['Home','Classes','Tests','Materials','Profile'].map((x,i)=>'<button class="navitem '+(section===x?'active':'')+'" onclick="section=\''+x+'\';go(\'dashboard\')"><span>'+['⌂','▣','☑','▤','♙'][i]+'</span>'+x+'</button>').join('')+'</nav>'}function tile(icon,title){return '<button class="tile" onclick="feature(\''+title.replace(/'/g,'')+'\')"><span class="symbol">'+icon+'</span><strong>'+title+'</strong></button>'}function feature(name){section=name;go('detail')}function render(){let s='';if(page==='splash'){s='<div class="splash"><div class="mark">🎓</div><h1>CENTUM</h1><h2>COACHING CENTRE</h2><p>NEET | JEE | TNPSC | UPSC | CUET<br>Foundation (9th – 12th)</p><button class="primary" onclick="go(\'roles\')">Get Started →</button></div>'}else if(page==='roles'){s='<div class="page"><div style="text-align:center;margin:20px 0">'+brand()+'</div><h2 class="heading">Choose Login</h2><div class="roles">'+[['student','🎓','Student Login','For Learning & Tests'],['teacher','👩‍🏫','Teacher Login','Manage Classes & Students'],['admin','⚙️','Admin Login','Institute Management']].map(a=>'<button class="role '+a[0]+'" onclick="go(\'login\',\''+a[0]+'\')"><span class="emoji">'+a[1]+'</span><span><strong>'+a[2]+'</strong><small>'+a[3]+'</small></span><span class="arrow">→</span></button>').join('')+'</div><button class="outline apply" onclick="feature(\'Student Registration\')">New Student? <span style="color:#d70d23">Apply Now</span></button></div>'}else if(page==='login'){s='<div class="page"><button class="back" onclick="go(\'roles\')">←</button><div style="display:flex;justify-content:center;margin:10px 0 22px">'+brand()+'</div><div class="loginicon">'+({student:'🎓',teacher:'👩‍🏫',admin:'⚙️'}[role])+'</div><h2 class="loginheading">'+role[0].toUpperCase()+role.slice(1)+' Login</h2><form onsubmit="event.preventDefault();section=\'Home\';go(\'dashboard\')"><input class="field" required placeholder="'+(role==='student'?'Student ID / Mobile Number':role==='admin'?'Admin ID / Email':'Teacher ID / Email')+'"><input class="field" required minlength="3" type="password" placeholder="Password"><p class="forgot" onclick="toast(\'Password reset requires backend integration\')">Forgot Password?</p><button class="primary">Login</button></form><div class="divider">OR</div><button class="outline" onclick="toast(\'OTP login requires backend integration\')">♧ &nbsp; Login with OTP</button><p class="tiny">New Student? <b onclick="feature(\'Student Registration\')">Register Now</b></p><p class="tiny" style="color:#888">Demo: any ID and password of 3+ characters</p></div>'}else if(page==='dashboard'){let items=role==='student'?[['▶️','Live Classes'],['📖','Study Materials'],['📝','Mock Tests'],['🎧','Doubt Support'],['📊','My Progress'],['🔔','Announcements']]:role==='teacher'?[['👥','My Classes'],['📤','Upload Material'],['📋','Create Test'],['📅','Attendance'],['📊','Student Progress'],['🏅','Marks & Results']]:[['👥','Student Management'],['👩‍🏫','Teacher Management'],['🎓','Batch & Course Management'],['₹','Fees & Payments'],['📋','Examinations'],['📊','Reports & Analytics'],['📅','Attendance'],['📢','Announcements'],['⚙️','System Settings']];s=header()+'<main class="page"><div class="hero"><div><h2>Hi, '+role[0].toUpperCase()+role.slice(1)+' 👋</h2><p>'+(role==='student'?'Keep Learning, Keep Growing':role==='teacher'?'Manage Classes & Track Progress':'Institute Management Panel')+'</p></div><div class="avatar">'+({student:'👨‍🎓',teacher:'👩‍🏫',admin:'👨‍💼'}[role])+'</div></div>'+(role==='student'?'<div class="promo"><h3>Prepare for<br>NEET | JEE | TNPSC<br>UPSC | CUET</h3><p>Foundation (9th – 12th)</p></div>':role==='admin'?'<div class="stats">'+[['1,248','Students'],['46','Teachers'],['28','Batches'],['6','Courses']].map(a=>'<div class="stat"><b>'+a[0]+'</b><small>'+a[1]+'</small></div>').join('')+'</div>':'')+'<div class="tiles" style="margin-top:15px">'+items.map(a=>tile(...a)).join('')+'</div>'+(role==='student'?'<h3 class="sectiontitle">My Courses</h3><div class="coursegrid">'+courses.map((c,i)=>'<button class="course" onclick="feature(\''+c+' Course\')"><span>'+icons[i]+'</span>'+c+'</button>').join('')+'</div>':role==='teacher'?'<h3 class="sectiontitle">Today’s Classes</h3><div class="panel"><b>NEET – Physics</b><p>11:00 AM – 12:00 PM · Demo schedule</p><button class="primary" onclick="toast(\'Live class integration coming soon\')">Join Class</button></div><h3 class="sectiontitle">Recent Activity</h3><div class="panel"><div class="listrow">✓ 24 students attended today <span class="tag">Sample</span></div><div class="listrow">✓ New test created – NEET Unit 3</div><div class="listrow">✓ Chemistry material uploaded</div></div>':'')+'</main>'+bottom()}else{s=header()+'<main class="page"><button class="back" onclick="go(\'dashboard\')">←</button><h2>'+section+'</h2><p style="color:#737b8b;font-size:13px">Explore the '+section.toLowerCase()+' module in this interactive prototype.</p><div class="panel"><b>'+section+' Overview</b><p>This is a sample interface. Real records, actions, and secure access will be enabled when the backend is connected.</p>'+(section.includes('Registration')?'<input class="field" placeholder="Student full name"><input class="field" placeholder="Mobile number"><button class="primary" onclick="toast(\'Demo only — no data submitted\')">Submit Enquiry</button>':'<div class="listrow">Demo record 01 <span class="tag">Active</span></div><div class="listrow">Demo record 02 <span class="tag">Sample</span></div>')+'</div></main>'+(role?bottom():'')}app.innerHTML=s}render();
</script></body></html>
