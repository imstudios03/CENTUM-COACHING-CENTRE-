<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c81024"><title>CENTUM Coaching Centre</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f7f6f8;color:#202638}.app{max-width:480px;margin:auto;min-height:100vh;background:#fff;position:relative;overflow:hidden}.splash{min-height:100vh;background:linear-gradient(150deg,#a9001b,#ef1c25 58%,#ff9d16);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}.cap{font-size:76px}.splash h1{font-size:48px;margin:12px 0 0}.splash h2{margin:0;font-size:20px}.splash p{line-height:1.7}.btn{border:0;border-radius:13px;padding:15px 20px;font-weight:800;font-size:16px;width:100%;background:linear-gradient(100deg,#ed152b,#b8001d);color:white}.splash .btn{background:white;color:#b8001d;margin-top:45px}.head{display:flex;align-items:center;justify-content:center;padding:18px}.logo{font-size:25px;font-weight:900;color:#b9001d;text-align:center}.logo small{display:block;font-size:10px;color:#202638}.page{padding:15px 19px 120px}.banner{padding:0;border-radius:18px;overflow:hidden;background:#a8001a;color:#fff;box-shadow:0 12px 28px #a8001a22}.banner-photo{height:205px;width:100%;object-fit:cover;display:block}.banner-copy{padding:21px 20px;background:linear-gradient(115deg,#a9001b,#e51c2d 68%,#f58213)}.photo-card{border-radius:15px;overflow:hidden;background:#fff;border:1px solid #eceef2;box-shadow:0 5px 16px #18234210}.photo-card img{width:100%;height:130px;object-fit:cover;display:block}.photo-card div{padding:12px;font-size:13px;font-weight:800}.photo-card small{display:block;color:#6b7280;font-weight:500;margin-top:5px}.image-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.float-label{display:flex;align-items:center;gap:7px}.banner h2{font-size:27px;margin:8px 0}.banner p{font-size:13px;line-height:1.7}.section{padding:18px 0;border-bottom:1px solid #eee}.section h3{margin:0 0 12px}.section p{font-size:13px;line-height:1.7;color:#626b7b;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.course{border:1px solid #e9eaf0;border-radius:12px;padding:14px;font-weight:800;font-size:13px}.course small{display:block;color:#687184;font-weight:500;margin-top:5px}.floats{position:fixed;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:5}.left{left:max(10px,calc((100vw - 480px)/2 + 10px))}.right{right:max(10px,calc((100vw - 480px)/2 + 10px))}.bubble{min-height:44px;min-width:52px;padding:0 13px;border:1px solid #ffffffaa;border-radius:16px;background:linear-gradient(135deg,#c81024,#970018);color:white;font-size:11px;font-weight:800;letter-spacing:.2px;box-shadow:0 7px 22px #7e001f35;backdrop-filter:blur(12px)}.bubble.light{width:48px;height:48px;min-width:48px;padding:0;border-radius:50%;background:#fff;color:#b90a20;font-size:21px;border:1px solid #eee;box-shadow:0 5px 18px #18234225}.roles{display:grid;gap:14px;padding:20px}.role{border:0;border-radius:15px;color:white;padding:22px;text-align:left;font-size:18px;font-weight:800}.role small{display:block;font-size:12px;margin-top:6px}.student{background:linear-gradient(100deg,#fa2638,#b60020)}.teacher{background:linear-gradient(100deg,#2871e9,#09256f)}.admin{background:linear-gradient(100deg,#ff9c16,#f15c00)}.field{width:100%;padding:15px;border:1px solid #d9dce4;border-radius:11px;margin:8px 0}.muted{text-align:center;color:#778;font-size:12px}button{cursor:pointer}@media(min-width:700px){body{padding:20px}.app{border-radius:25px;min-height:850px}}</style></head><body><div class="app" id="app"></div><script>
const app=document.getElementById('app');let role='';function go(page){if(page==='profile')profile();else if(page==='roles')roles();else login(page)}
function splash(){app.innerHTML='<main class="splash"><div class="cap">🎓</div><h1>CENTUM</h1><h2>COACHING CENTRE</h2><p>NEET | JEE | TNPSC | UPSC | CUET<br>Foundation (9th–12th)</p><button class="btn" onclick="go(\'profile\')">Get Started →</button></main>'}
function profile(){app.innerHTML='<header class="head"><div class="logo">🎓 CENTUM<small>COACHING CENTRE</small></div></header><main class="page"><section class="banner"><img class="banner-photo" src="https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=1000&q=85" alt="Students learning in a classroom"><div class="banner-copy"><div style="font-size:12px;font-weight:800;letter-spacing:1.5px">CENTUM COACHING CENTRE</div><h2>Learn Today.<br>Lead Tomorrow.</h2><p>Structured academic coaching and competitive examination preparation with focused learning support.</p></div></section><section class="section"><h3>About Centum</h3><p>Build strong fundamentals, develop exam confidence and track your academic progress with guided learning.</p></section><section class="section"><h3>Academic Programmes</h3><div class="grid"><div class="course">🩺 NEET<small>Medical entrance</small></div><div class="course">⚙️ JEE<small>Engineering entrance</small></div><div class="course">🏛️ TNPSC<small>Government exams</small></div><div class="course">⚖️ UPSC<small>Civil services</small></div><div class="course">🎓 CUET<small>University entrance</small></div><div class="course">📚 Foundation<small>Classes 9th–12th</small></div></div></section><section class="section"><h3>Learning Experience</h3><div class="image-grid"><article class="photo-card"><img src="https://images.unsplash.com/photo-1427504494785-3a9ca7044f45?auto=format&fit=crop&w=700&q=80" alt="Students studying together"><div>Collaborative Learning<small>Learn, discuss and grow</small></div></article><article class="photo-card"><img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=700&q=80" alt="Student studying with books"><div>Focused Preparation<small>Build strong fundamentals</small></div></article></div><p style="margin-top:12px">Concept-based lessons · Practice tests · Study materials · Progress reviews · Doubt support · Academic guidance</p></section><section class="section"><h3>Our Academic Environment</h3><div class="photo-card"><img src="https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=1000&q=80" alt="University campus building" style="height:160px"><div>Building a brighter academic future<small>Student, teacher and institute portals for learning resources and academic management.</small></div></div></section></main><div class="floats left"><button class="bubble" onclick="role=\'student\';login()">Student Login</button><button class="bubble" onclick="role=\'teacher\';login()">Teacher Login</button><button class="bubble" onclick="role=\'admin\';login()">Admin Login</button></div><div class="floats right"><button class="bubble light" onclick="alert(\'Add official phone number to activate call\')">☎</button><button class="bubble light" onclick="alert(\'Add official WhatsApp number to activate chat\')">◉</button><button class="bubble light" onclick="alert(\'Add Google Maps location link to activate directions\')">⌖</button></div>'}
function roles(){app.innerHTML='<header class="head"><div class="logo">🎓 CENTUM<small>COACHING CENTRE</small></div></header><h2 style="text-align:center">Choose Login</h2><div class="roles"><button class="role student" onclick="role=\'student\';login()">🎓 Student Login<small>For Learning & Tests</small></button><button class="role teacher" onclick="role=\'teacher\';login()">👩‍🏫 Teacher Login<small>Manage Classes & Students</small></button><button class="role admin" onclick="role=\'admin\';login()">⚙️ Admin Login<small>Institute Management</small></button></div>'}
function login(){app.innerHTML='<main class="page"><button onclick="profile()" style="border:0;background:none;color:#c10b23;font-size:25px">←</button><header class="head"><div class="logo">🎓 CENTUM<small>COACHING CENTRE</small></div></header><h2 style="text-align:center">'+role.toUpperCase()+' LOGIN</h2><form onsubmit="event.preventDefault();alert(\'Demo login only. Backend authentication is not connected.\')"><input class="field" required placeholder="'+(role==='student'?'Student ID / Mobile Number':role==='teacher'?'Teacher ID / Email':'Admin ID / Email')+'"><input class="field" type="password" required minlength="3" placeholder="Password"><button class="btn">Login</button></form><p class="muted">Demo: any ID and password with at least 3 characters.</p></main>'}
splash();
</script></div></body></html>
